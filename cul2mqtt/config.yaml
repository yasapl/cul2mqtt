name: CUL2MQTT
version: '0.1.0'
slug: cul2mqtt
description: Bridge a network CUL/MAXCUL to Home Assistant MQTT discovery
url: https://github.com/yasapl/cul2mqtt
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
init: false
services:
  - mqtt:need
options:
  maxcul_host: ''
  maxcul_port: 2323
  fht_central: ''
  instance_name: cul
  log_level: info
  publish_raw: false
  publish_events: true
  offline_detection: true
schema:
  maxcul_host: str
  maxcul_port: port
  fht_central: str
  instance_name: str
  log_level: list(error|warn|info|debug)
  publish_raw: bool
  publish_events: bool
  offline_detection: bool
